name: Deploy Kargo Knot

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          args: --ssh

      - name: Wait for network
        run: sleep 10

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 100.97.42.1
          username: yash
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            echo "🚀 Navigating to project..."
            cd ~/kargo/Kargo-Knot

            echo "📥 Pulling latest code..."
            git pull origin main

            if [ ! -f .env ]; then
              echo "❌ Missing .env file. Run once on the server:"
              echo "   cp .env.example .env"
              echo "   nano .env   # set YOUR_SQL_CONTAINER in ConnectionStrings__DefaultConnection"
              exit 1
            fi

            echo "🛑 Stopping containers..."
            /usr/bin/docker-compose down --remove-orphans || true

            echo "🏗️ Building containers..."
            /usr/bin/docker-compose up -d --build --remove-orphans

            echo "⏳ Waiting for services..."
            sleep 60

            if ! /usr/bin/docker-compose ps | grep -q "kargoknot-api.*Up"; then
              echo "❌ kargoknot-api failed to start. Logs:"
              /usr/bin/docker-compose logs --tail=80 kargoknot-api
              exit 1
            fi

            echo "✅ Deployment completed successfully!"
