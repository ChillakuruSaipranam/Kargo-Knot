# Add these blocks to your PORTFOLIO nginx config (inside portfolio-web container).
# File is usually: portfolio/docker/nginx/default.conf
#
# IMPORTANT: Place BEFORE the catch-all "location /" block — otherwise portfolio
# SPA serves index.html for every path including /kargoknot.
#
# Portfolio container must reach Kargo Knot on host port 8082.
# Add to portfolio docker-compose.yml under portfolio-web:
#   extra_hosts:
#     - "host.docker.internal:host-gateway"
#
# Then rebuild portfolio: docker compose up -d --build portfolio-web

# Redirect /kargoknot → /kargoknot/
location = /kargoknot {
    return 301 /kargoknot/;
}

# Proxy Kargo Knot (runs on host port 8082)
location ^~ /kargoknot/ {
    proxy_pass http://host.docker.internal:8082/kargoknot/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 180s;
}
