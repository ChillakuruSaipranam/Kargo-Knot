# Add this location block to your VPS host nginx (the one serving yashpc / portfolio on port 80).
# Kargo Knot runs on host port 8082 by default (see WEB_PORT in .env).

location /kargoknot/ {
    proxy_pass http://127.0.0.1:8082/kargoknot/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 180s;
}
