server {
    listen 80;
    server_name _;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;

    location = /kargoknot {
        return 301 /kargoknot/;
    }

    # .NET API
    location /kargoknot/api/ {
        proxy_pass http://kargoknot-api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    location /kargoknot/health {
        proxy_pass http://kargoknot-api:8080/health;
    }

    # Angular SPA + static assets (built with --base-href=/kargoknot/)
    location /kargoknot/ {
        alias /usr/share/nginx/html/kargoknot/;
        index index.html;
        try_files $uri $uri/ /kargoknot/index.html;
    }
}
