<div class="forgot-page">
  <div
    class="forgot-backdrop"
    [style.background-image]="'url(' + backgroundUrl + ')'"
    aria-hidden="true"
  ></div>

  <section class="forgot-card">
    @if (step() === 'email') {
      <header>
        <h2>Reset Password</h2>
        <p class="muted">Enter your email address and we'll send you a reset link.</p>
      </header>

      <form [formGroup]="emailForm" (ngSubmit)="submitEmail()">
        <label>
          <span>Email Address</span>
          <input type="email" formControlName="email" placeholder="name@transport.com" autocomplete="email" />
          <small *ngIf="emailForm.controls.email.touched && emailForm.controls.email.invalid">Enter a valid email address.</small>
        </label>

        @if (errorMessage()) {
          <div class="alert alert-error" role="alert">{{ errorMessage() }}</div>
        }

        <div class="actions">
          <button class="btn btn-primary" type="submit" [disabled]="isSubmitting()">{{ isSubmitting() ? 'Sending...' : 'Send Reset Link' }}</button>
          <button type="button" class="btn btn-secondary" (click)="backToLogin()">Back to Sign In</button>
        </div>
      </form>
    } @else {
      <header>
        <h2>Create New Password</h2>
        <p class="muted">Enter your email and set a new password.</p>
      </header>

      <form [formGroup]="resetForm" (ngSubmit)="submitReset()">
        <label>
          <span>Email</span>
          <input type="email" formControlName="email" placeholder="you@transport.com" autocomplete="email" readonly />
          <small *ngIf="resetForm.controls.email.touched && resetForm.controls.email.invalid">Enter a valid email address.</small>
        </label>

        <!-- No reset code required; using email verification only -->

        <label>
          <span>New Password</span>
          <input type="password" formControlName="password" placeholder="At least 6 characters" autocomplete="new-password" />
          <small *ngIf="resetForm.controls.password.touched && resetForm.controls.password.invalid">Password must be at least 6 characters.</small>
        </label>

        <label>
          <span>Confirm Password</span>
          <input type="password" formControlName="confirmPassword" placeholder="Confirm your password" autocomplete="new-password" />
          <small *ngIf="resetForm.controls.confirmPassword.touched && resetForm.controls.confirmPassword.invalid">Confirm password is required.</small>
        </label>

        @if (errorMessage()) {
          <div class="alert alert-error" role="alert">{{ errorMessage() }}</div>
        }

        <div class="actions">
          <button class="btn btn-primary" type="submit" [disabled]="isSubmitting()">{{ isSubmitting() ? 'Resetting...' : 'Reset Password' }}</button>
          <button type="button" class="btn btn-secondary" (click)="backToEmail()">Back</button>
        </div>
      </form>
    }
  </section>
</div>
