# Kargo Knot stack: Angular (nginx) + .NET API
# Uses your existing SQL Server container on the VPS (shared Docker network).
#
#   cp .env.example .env   # fill in values once on the server
#   docker compose up -d --build

services:
  kargoknot-api:
    image: kargoknot-api
    build:
      context: .
      dockerfile: truck-transport-api/Dockerfile
    container_name: kargoknot-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      Jwt__Issuer: TruckTransportApi
      Jwt__Audience: TruckTransportApp
    networks:
      - kargoknot-network
      - sqlserver-network
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

  kargoknot-web:
    image: kargoknot-frontend
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        BASE_HREF: ${BASE_HREF:-/kargoknot/}
    container_name: kargoknot-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8082}:80"
    depends_on:
      kargoknot-api:
        condition: service_healthy
    networks:
      - kargoknot-network

networks:
  kargoknot-network:
    driver: bridge
  sqlserver-network:
    external: true
    name: ${SQLSERVER_NETWORK:-contactmanager}
