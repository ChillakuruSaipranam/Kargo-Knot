# Kargo Knot stack: Angular (nginx) + .NET API
# Uses your existing SQL Server container on the VPS (shared Docker network).
#
#   cp .env.example .env   # fill secrets + SQLSERVER_NETWORK
#   docker compose up -d --build
#
# Served at http://yashpc/kargoknot/ — add docker/nginx/vps-host-snippet.conf
# to your VPS host nginx (alongside the portfolio site on port 80).

services:
  kargoknot-api:
    image: kargoknot-api
    build:
      context: .
      dockerfile: truck-transport-api/Dockerfile
    container_name: kargoknot-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Server=${SQLSERVER_HOST:?set SQLSERVER_HOST to your SQL container name},1433;Database=TruckTransportDb;User ID=sa;Password=${SQLSERVER_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=True
      Jwt__Key: ${JWT_KEY:?set JWT_KEY in .env}
      Jwt__Issuer: TruckTransportApi
      Jwt__Audience: TruckTransportApp
      Cors__Origins__0: ${PUBLIC_URL:-http://yashpc}
    networks:
      - kargoknot-network
      - sqlserver-network
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  kargoknot-web:
    image: kargoknot-frontend
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        BASE_HREF: ${BASE_HREF:-/kargoknot/}
    container_name: kargoknot-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8082}:80"
    depends_on:
      kargoknot-api:
        condition: service_healthy
    networks:
      - kargoknot-network

networks:
  kargoknot-network:
    driver: bridge
  sqlserver-network:
    external: true
    name: ${SQLSERVER_NETWORK:?set SQLSERVER_NETWORK in .env}
